<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split — Create Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F1210;
    --paper: #F7F5F0;
    --paper-dim: #EFEBE1;
    --line: #DCD7C9;
    --green: #2E7D5B;
    --green-tint: #E4EFE8;
    --amber: #C77B3D;
    --muted: #6B6A62;
    --white: #FFFFFF;
    --font-ui: 'Manrope', 'Inter', sans-serif;
  }
  body[data-theme="dark"] {
    --ink: #EEF3EE;
    --paper: #111813;
    --paper-dim: #181F1B;
    --line: rgba(238, 243, 238, 0.12);
    --green: #2E7D5B;
    --green-tint: rgba(46, 125, 91, 0.18);
    --amber: #C77B3D;
    --muted: #AAB5AD;
    --white: #1A221E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper);
    font-family: var(--font-ui);
    color: var(--ink);
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .content { padding: 20px 20px 32px; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .screen-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 4px;
  }
  .nav-back {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--white); color: var(--ink); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .screen-title {
    font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600;
    flex: 1; text-align: center; margin-right: 36px;
  }
  .card {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
  }
  .field-group { display: flex; flex-direction: column; gap: 8px; }
  .field-label {
    font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
    font-weight: 600;
  }
  .input {
    width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
    padding: 14px 12px; font: inherit; color: var(--ink); outline: none;
  }
  .input:focus { border-color: var(--green); }
  .smart-card {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .smart-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .smart-title {
    font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
    font-weight: 700;
  }
  .chip-row {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
    padding: 8px 10px; font: inherit; font-size: 11px; font-weight: 700; color: var(--ink);
  }
  .chip.active {
    background: var(--green-tint); border-color: transparent; color: var(--green);
  }
  .participant-card {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 12px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .participant-row {
    display: grid; grid-template-columns: 1fr 110px; gap: 12px; align-items: center;
  }
  .participant-name {
    font-size: 14px; font-weight: 700;
  }
  .participant-meta {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .participant-status {
    font-size: 9.5px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700;
    color: var(--green); background: var(--green-tint); border-radius: 999px; padding: 5px 6px;
  }
  .participant-share {
    font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; text-align: right;
  }
  .participant-amount {
    font-size: 10.5px; color: var(--muted); text-align: right; margin-top: 3px;
  }
  .amount-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 8px;
  }
  .amount-value {
    font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600;
  }
  .cta {
    display: inline-flex; align-items: center; justify-content: center; width: 100%;
    border: none; border-radius: 14px; padding: 16px 18px; background: var(--ink);
    color: var(--white); font: inherit; font-weight: 600; text-decoration: none;
  }
  .tabbar {
    position: sticky; bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; align-items: center;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 600; color: #ADA99A;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 6px 8px; border-radius: 10px; text-decoration: none;
  }
  .tab-item.on {
    color: var(--ink);
    background: var(--green-tint);
  }
  .tab-item.on .tab-icon { color: var(--green); }
  .tab-icon { font-size: 18px; }
  @media (min-width: 481px) {
    body { background: var(--paper-dim); }
    .page {
      margin-top: 24px;
      margin-bottom: 24px;
      background: var(--paper);
      border-radius: 20px;
      border: 1px solid var(--line);
      overflow: hidden;
      min-height: calc(100vh - 48px);
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="content">
      <div class="screen-header">
        <a class="nav-back" href="index.html" aria-label="Back to home">←</a>
        <div class="screen-title">Create split</div>
        <div style="width: 36px;"></div>
      </div>

      <div class="card">
        <div class="field-group">
          <label class="field-label" for="projectName">Project name</label>
          <input class="input" id="projectName" type="text" value="Brand campaign" aria-label="Project name">
        </div>
      </div>

      <div class="card">
        <div class="field-group">
          <label class="field-label" for="totalAmount">Total amount</label>
          <input class="input" id="totalAmount" type="text" value="₦240,000" aria-label="Total amount">
        </div>
      </div>

      <div class="smart-card">
        <div class="smart-head">
          <div class="smart-title">Smart split</div>
          <div class="status-pill ok" style="font-size:9px; padding:6px 8px;">Auto</div>
        </div>
        <div class="chip-row">
          <button class="chip active" type="button">Even split</button>
          <button class="chip" type="button">Custom rules</button>
          <button class="chip" type="button">By balance</button>
        </div>
      </div>

      <div class="participant-card">
        <div class="participant-row">
          <div class="participant-meta">
            <div>
              <div class="participant-name">Tola</div>
              <div class="participant-status">Paid</div>
            </div>
          </div>
          <div>
            <div class="participant-share">45%</div>
            <div class="participant-amount">₦108,000</div>
          </div>
        </div>

        <div class="participant-row">
          <div class="participant-meta">
            <div>
              <div class="participant-name">Ada</div>
              <div class="participant-status" style="background:#f3e6d3;color:var(--amber);">Pending</div>
            </div>
          </div>
          <div>
            <div class="participant-share">35%</div>
            <div class="participant-amount">₦84,000</div>
          </div>
        </div>

        <div class="participant-row">
          <div class="participant-meta">
            <div>
              <div class="participant-name">Kelechi</div>
              <div class="participant-status">Ready</div>
            </div>
          </div>
          <div>
            <div class="participant-share">20%</div>
            <div class="participant-amount">₦48,000</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="amount-row">
          <span class="field-label">Total split</span>
          <span class="amount-value">100%</span>
        </div>
      </div>

      <a class="cta" href="split-review.html">Review split</a>
    </div>

    <div class="tabbar">
      <a class="tab-item" href="index.html"><div class="tab-icon">⌂</div>Home</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">🏦</div>Banks</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">📈</div>Insights</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">🔗</div>Links</a>
      <a class="tab-item" href="account.html"><div class="tab-icon">👤</div>Account</a>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://split-concept-demo.onrender.com';

    async function requireAuth() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/me`, { credentials: 'include' });
        if (!response.ok) {
          throw new Error('Not authenticated');
        }
      } catch (_error) {
        window.location.replace('account.html');
      }
    }

    const savedTheme = localStorage.getItem('split-theme') || 'light';
    document.body.setAttribute('data-theme', savedTheme);
    requireAuth();
  </script>
</body>
</html>
