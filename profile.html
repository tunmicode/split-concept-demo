<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F1210;
    --paper: #F7F5F0;
    --paper-dim: #EFEBE1;
    --line: #DCD7C9;
    --green: #2E7D5B;
    --green-tint: #E4EFE8;
    --amber: #C77B3D;
    --muted: #6B6A62;
    --white: #FFFFFF;
    --font-ui: 'Manrope', 'Inter', sans-serif;
  }
  body[data-theme="dark"] {
    --ink: #EEF3EE;
    --paper: #111813;
    --paper-dim: #181F1B;
    --line: rgba(238, 243, 238, 0.12);
    --green: #2E7D5B;
    --green-tint: rgba(46, 125, 91, 0.18);
    --amber: #C77B3D;
    --muted: #AAB5AD;
    --white: #1A221E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper);
    font-family: var(--font-ui);
    color: var(--ink);
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .content { padding: 20px 20px 32px; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .screen-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 4px;
  }
  .nav-back {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--white); color: var(--ink); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .screen-title {
    font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600;
    flex: 1; text-align: center; margin-right: 36px;
  }
  .profile-card {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .profile-avatar {
    width: 64px; height: 64px; border-radius: 50%; background: var(--green);
    color: var(--white); display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px;
  }
  .detail-list {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px;
    padding: 0 18px;
  }
  .detail-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 0; border-top: 1px solid var(--line);
  }
  .detail-row:first-child { border-top: none; }
  .detail-label { font-size: 12px; color: var(--muted); }
  .detail-value {
    font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; text-align: right;
  }
  .tabbar {
    position: sticky; bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; align-items: center;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 600; color: #ADA99A;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 6px 8px; border-radius: 10px; text-decoration: none;
  }
  .tab-item.on {
    color: var(--ink);
    background: var(--green-tint);
  }
  .tab-item.on .tab-icon { color: var(--green); }
  .tab-icon { font-size: 18px; }
  @media (min-width: 481px) {
    body { background: var(--paper-dim); }
    .page {
      margin-top: 24px;
      margin-bottom: 24px;
      background: var(--paper);
      border-radius: 20px;
      border: 1px solid var(--line);
      overflow: hidden;
      min-height: calc(100vh - 48px);
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="content">
      <div class="screen-header">
        <a class="nav-back" href="index.html" aria-label="Back">←</a>
        <div class="screen-title">Profile</div>
        <div style="width: 36px;"></div>
      </div>

      <div class="profile-card">
        <div class="profile-avatar">T</div>
      </div>

      <div class="detail-list">
        <div class="detail-row">
          <div class="detail-label">Full name</div>
          <div class="detail-value">Tunmi </div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Email</div>
          <div class="detail-value">tunmi@split.app</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Phone</div>
          <div class="detail-value">+234 806 179 3781</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Location</div>
          <div class="detail-value">Lagos</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Member since</div>
          <div class="detail-value">Apr 2026</div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <a class="tab-item" href="index.html"><div class="tab-icon">⌂</div>Home</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">🏦</div>Banks</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">📈</div>Insights</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">🔗</div>Links</a>
      <a class="tab-item on" href="account.html"><div class="tab-icon">👤</div>Account</a>
    </div>
  </div>

  <script>
    const savedTheme = localStorage.getItem('split-theme') || 'light';
    document.body.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
