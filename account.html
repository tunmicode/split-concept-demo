<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split — Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F3EFE7;
    --paper: #0C100E;
    --paper-dim: #121915;
    --line: rgba(243, 239, 231, 0.12);
    --green: #66D99D;
    --green-tint: rgba(102, 217, 157, 0.12);
    --amber: #C77B3D;
    --muted: #B5B0A6;
    --white: #F5F0E7;
    --card-bg: #1A201D;
    --card-bg-strong: #131916;
    --card-border: rgba(245, 240, 231, 0.12);
    --card-shadow: rgba(0, 0, 0, 0.42);
    --font-ui: 'Manrope', 'Inter', sans-serif;
    --hero-glow: rgba(102, 217, 157, 0.13);
  }
  body[data-theme="dark"] {
    --ink: #F3EFE7;
    --paper: #0C100E;
    --paper-dim: #121915;
    --line: rgba(243, 239, 231, 0.12);
    --green: #66D99D;
    --green-tint: rgba(102, 217, 157, 0.12);
    --amber: #C77B3D;
    --muted: #B5B0A6;
    --white: #F5F0E7;
    --card-bg: #1A201D;
    --card-bg-strong: #131916;
    --card-border: rgba(245, 240, 231, 0.12);
    --card-shadow: rgba(0, 0, 0, 0.42);
    --hero-glow: rgba(102, 217, 157, 0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper);
    font-family: var(--font-ui);
    color: var(--ink);
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at top, var(--hero-glow), transparent 42%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-dim) 100%);
  }
  .page {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .content { padding: 20px 20px 32px; flex: 1; display: flex; flex-direction: column; gap: 18px; }
  .screen-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 4px;
  }
  .nav-back {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--white); color: var(--ink); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .screen-title {
    font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600;
    flex: 1; text-align: center; margin-right: 36px;
  }
  .brand-top {
    text-align: center;
    padding-top: 8px;
    padding-bottom: 2px;
  }
  .brand-mark {
    display: none;
  }
  .brand-wordmark {
    font-family: 'Fraunces', serif; font-size: clamp(34px, 9vw, 48px);
    letter-spacing: -0.08em; line-height: 0.94; font-weight: 600; color: #F5F0E7;
    text-shadow: 0 0 18px rgba(245, 240, 231, 0.24), 0 0 34px rgba(102, 217, 157, 0.12);
  }
  .brand-subtle {
    margin-top: 8px; font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
  }
  .auth-card {
    background: linear-gradient(180deg, var(--card-bg), var(--card-bg-strong));
    border: 1px solid var(--card-border); border-radius: 20px;
    padding: 18px 18px 16px;
    display: flex; flex-direction: column; gap: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 18px 36px var(--card-shadow), 0 2px 10px rgba(17,24,19,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .auth-card h3 {
    font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600;
    letter-spacing: -0.04em;
    margin-top: 2px;
  }
  .auth-card .auth-sub {
    font-size: 13px; color: var(--muted);
    line-height: 1.5;
    margin-top: -2px;
  }
  .support-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; background: transparent; color: var(--muted); padding: 4px 2px; font-size: 12px; font-weight: 700;
    cursor: pointer; text-decoration: none; text-underline-offset: 0; 
  }
  .support-cta:hover, .support-cta:focus-visible { text-decoration: none; }
  .support-shell {
    display: none;
    margin-top: 8px;
    background: rgba(255,255,255,0.8); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden; box-shadow: 0 12px 24px rgba(17,24,19,0.06);
  }
  .support-shell.open {
    display: block;
  }
  .support-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .support-title-wrap {
    display: flex; align-items: center; gap: 8px; font-weight: 700;
  }
  .support-dot {
    width: 9px; height: 9px; border-radius: 50%; background: #45c379; box-shadow: 0 0 12px rgba(69,195,121,0.7);
  }
  .support-close {
    appearance: none; border: 1px solid var(--line); background: transparent; width: 30px; height: 30px;
    border-radius: 50%; font-size: 18px; color: var(--ink); cursor: pointer;
  }
  .support-quick-actions {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .quick-pill {
    border: 1px solid var(--line); background: rgba(17,24,19,0.03); color: var(--ink);
    border-radius: 999px; padding: 7px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; cursor: pointer;
  }
  .support-messages {
    max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px;
    background: rgba(17,24,19,0.01);
  }
  .msg {
    max-width: 82%; padding: 10px 12px; border-radius: 14px; font-size: 12px; line-height: 1.5;
  }
  .msg-incoming {
    background: rgba(17,24,19,0.04); color: var(--ink); align-self: flex-start;
  }
  .msg-outgoing {
    background: rgba(46,125,91,0.12); color: var(--ink); align-self: flex-end;
  }
  .support-input-row {
    display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line);
  }
  .support-input {
    flex: 1; border: 1px solid var(--line); border-radius: 12px; background: rgba(17,24,19,0.02); color: var(--ink);
    padding: 10px 12px; font: inherit; outline: none;
  }
  .support-send {
    border: none; border-radius: 12px; background: var(--ink); color: var(--white); padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .auth-form {
    display: flex; flex-direction: column; gap: 10px;
    margin-top: 2px;
  }
  .auth-form input {
    width: 100%; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; background: rgba(10,14,12,0.8);
    padding: 13px 14px; font: inherit; color: var(--ink); outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .auth-form input:focus {
    border-color: rgba(122,224,169,0.8);
    box-shadow: 0 0 0 3px rgba(122,224,169,0.12);
  }
  .auth-form button, .inline-btn {
    border: none; border-radius: 12px; background: linear-gradient(180deg, #1c221f, #111813); color: var(--white);
    padding: 14px 14px; font: inherit; font-weight: 700; cursor: pointer;
    transition: transform 0.14s ease, opacity 0.14s ease, box-shadow 0.15s ease;
    box-shadow: 0 10px 18px rgba(17,24,19,0.12);
  }
  .auth-form button:hover, .inline-btn:hover { transform: translateY(-1px); }
  .inline-btn {
    background: rgba(46,125,91,0.05); border: 1px solid rgba(46,125,91,0.18); color: var(--ink); margin-top: 2px; font-weight: 600; box-shadow: none;
  }
  .auth-status {
    min-height: 18px; font-size: 12px; color: var(--green);
  }
  .auth-status.error { color: #b94a48; }
  .profile-card {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px;
    display: flex; align-items: center; gap: 12px;
  }
  .profile-avatar {
    width: 48px; height: 48px; border-radius: 50%; background: var(--green);
    color: var(--white); display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px;
    flex-shrink: 0; background-size: cover; background-position: center; overflow: hidden;
  }
  .avatar-preview {
    width: 38px; height: 38px; border-radius: 50%; background: var(--green);
    color: var(--white); display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px;
    flex-shrink: 0; background-size: cover; background-position: center; overflow: hidden;
  }
  .profile-copy { flex: 1; min-width: 0; }
  .profile-name {
    font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600;
    line-height: 1.1;
  }
  .profile-meta {
    font-size: 12px; color: var(--muted); margin-top: 3px;
  }
  .profile-badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--green); background: var(--green-tint);
    padding: 7px 8px; border-radius: 999px;
  }
  .list-card {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px;
    padding: 0 18px;
  }
  .list-row {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: none; border: none; border-top: 1px solid var(--line);
    padding: 15px 0; text-align: left; color: var(--ink); font: inherit; cursor: pointer;
    text-decoration: none;
  }
  #themeToggle .row-arrow {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 700;
    color: var(--green);
  }
  .list-row:first-child { border-top: none; }
  .row-copy { flex: 1; min-width: 0; }
  .row-label { font-size: 14px; font-weight: 600; }
  .row-arrow {
    font-size: 22px; color: var(--muted); line-height: 1; margin-left: 8px;
  }
  .tabbar {
    position: sticky; bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; align-items: center;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 600; color: #ADA99A;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 6px 8px; border-radius: 10px; text-decoration: none;
  }
  .tab-item.on {
    color: var(--ink);
    background: var(--green-tint);
  }
  .tab-item.on .tab-icon { color: var(--green); }
  .tab-icon { font-size: 18px; }
  .hidden { display: none !important; }
  @media (min-width: 481px) {
    body { background: var(--paper-dim); }
    .page {
      margin-top: 24px;
      margin-bottom: 24px;
      background: var(--paper);
      border-radius: 20px;
      border: 1px solid var(--line);
      overflow: hidden;
      min-height: calc(100vh - 48px);
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="content">
      <div class="screen-header hidden" id="accountHeader">
        <a class="nav-back" href="index.html" aria-label="Back to home">←</a>
        <div class="screen-title">Account</div>
        <div style="width: 36px;"></div>
      </div>

      <div class="brand-top" aria-label="Split brand">
        <div class="brand-wordmark">Split</div>
        <div class="brand-subtle">Secure access</div>
      </div>

      <div class="auth-card" id="authCard">
        <h3 id="authTitle">Create your account</h3>
        <div class="auth-sub" id="authSubtitle">One payment in, everyone gets their agreed share.</div>
        <form class="auth-form" id="authForm">
          <input id="authFullName" name="fullName" type="text" placeholder="Full name" />
          <input id="authLogin" name="login" type="text" placeholder="Email or phone or username" />
          <input id="authPassword" name="password" type="password" placeholder="Password" />
          <button id="authSubmitBtn" type="submit">Create account</button>
          <button class="inline-btn" type="button" id="toggleAuthMode">Switch to login</button>
        </form>
        <div class="auth-status" id="authStatus"></div>
        <button class="support-cta" id="helpSigninBtn" type="button">Need help signing in?</button>

        <div class="support-shell" id="supportShell" aria-live="polite">
          <div class="support-header">
            <div class="support-title-wrap"><span class="support-dot"></span> Support</div>
            <button class="support-close" type="button" aria-label="Close support">×</button>
          </div>
          <div class="support-quick-actions">
            <button class="quick-pill" type="button">Password reset</button>
            <button class="quick-pill" type="button">Verify email</button>
            <button class="quick-pill" type="button">Account access</button>
          </div>
          <div class="support-messages">
            <div class="msg msg-incoming">Hi — we can help with sign-in issues, verification, and account access.</div>
          </div>
          <div class="support-input-row">
            <input class="support-input" type="text" placeholder="Tell us what’s going wrong" aria-label="Tell us what’s going wrong" />
            <button class="support-send" type="button">Send</button>
          </div>
        </div>
      </div>

      <div id="accountPanelContainer"></div>
    </div>

    <div class="tabbar hidden" id="accountTabbar">
      <a class="tab-item" href="index.html"><div class="tab-icon">⌂</div>Home</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">🏦</div>Banks</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">📈</div>Insights</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">🔗</div>Links</a>
      <a class="tab-item on" href="account.html"><div class="tab-icon">👤</div>Account</a>
    </div>
  </div>

  <script>
    const body = document.body;
    const accountPanelContainer = document.getElementById('accountPanelContainer');
    const accountHeader = document.getElementById('accountHeader');
    const accountTabbar = document.getElementById('accountTabbar');
    const authForm = document.getElementById('authForm');
    const authStatus = document.getElementById('authStatus');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const toggleAuthModeBtn = document.getElementById('toggleAuthMode');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const authFullName = document.getElementById('authFullName');
    const authLogin = document.getElementById('authLogin');
    let authVerification = document.getElementById('authVerification');
    const authPassword = document.getElementById('authPassword');
    const helpSigninBtn = document.getElementById('helpSigninBtn');
    const supportShell = document.getElementById('supportShell');
    const supportMessages = document.querySelector('#supportShell .support-messages');
    const supportInput = document.querySelector('#supportShell .support-input');
    const supportSend = document.querySelector('#supportShell .support-send');
    const supportClose = document.querySelector('#supportShell .support-close');
    const quickPills = document.querySelectorAll('#supportShell .quick-pill');
    let themeToggle = null;
    let themeLabel = null;
    let profileImageInput = null;
    let profilePicturePicker = null;
    let avatarPreview = null;
    let accountAvatar = null;
    let logoutBtn = null;
    let homeAvatar = document.querySelector('.greet-avatar');
    let authMode = 'signup';
    let pendingUserId = null;

    function setAuthStatus(message, isError = false) {
      if (!authStatus) return;
      authStatus.textContent = message || '';
      authStatus.classList.toggle('error', isError);
    }

    function getSupportReply(value) {
      const text = (value || '').toLowerCase();
      if (text.includes('password') || text.includes('reset')) return 'You can reset your password from the login screen, or contact us and we’ll help you verify the account email before reset.';
      if (text.includes('verify') || text.includes('code') || text.includes('email')) return 'If you were sent a verification code, enter it on the form before attempting a full login. We can also help you resend it.';
      if (text.includes('login') || text.includes('sign')) return 'We can help confirm whether the account exists, the email is verified, and whether the password is correct.';
      return 'I can help troubleshoot your sign-in issue. Share the email or username you’re using and I’ll guide the next step.';
    }

    function setSupportOpen(isOpen) {
      if (!supportShell) return;
      supportShell.classList.toggle('open', isOpen);
    }

    function addSupportMessage(text, outgoing = false) {
      if (!supportMessages) return;
      const message = document.createElement('div');
      message.className = `msg ${outgoing ? 'msg-outgoing' : 'msg-incoming'}`;
      message.textContent = text;
      supportMessages.appendChild(message);
      supportMessages.scrollTop = supportMessages.scrollHeight;
    }

    function sendSupportMessage() {
      const value = supportInput?.value.trim();
      if (!value) return;
      addSupportMessage(value, true);
      supportInput.value = '';
      setTimeout(() => addSupportMessage(getSupportReply(value), false), 250);
    }

    helpSigninBtn?.addEventListener('click', () => {
      setSupportOpen(true);
      requestAnimationFrame(() => supportInput?.focus());
    });
    supportClose?.addEventListener('click', () => setSupportOpen(false));
    supportSend?.addEventListener('click', sendSupportMessage);
    supportInput?.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendSupportMessage();
      }
    });
    quickPills.forEach((pill) => {
      pill.addEventListener('click', () => {
        const value = pill.textContent.trim();
        addSupportMessage(value, true);
        setTimeout(() => addSupportMessage(getSupportReply(value), false), 250);
      });
    });

    function setAccountSectionsVisible(visible) {
      [accountHeader, accountTabbar].forEach((section) => {
        if (!section) return;
        section.classList.toggle('hidden', !visible);
      });

      if (!visible) {
        if (accountPanelContainer) {
          accountPanelContainer.innerHTML = '';
        }
        themeToggle = null;
        themeLabel = null;
        profileImageInput = null;
        profilePicturePicker = null;
        avatarPreview = null;
        accountAvatar = null;
        logoutBtn = null;
        return;
      }

      if (accountPanelContainer && !accountPanelContainer.innerHTML.trim()) {
        accountPanelContainer.innerHTML = `
          <div class="profile-card">
            <div class="profile-avatar" id="accountAvatar">T</div>
            <div class="profile-copy">
              <div class="profile-name">Tunmi</div>
              <div class="profile-meta">Premium member</div>
            </div>
            <div class="profile-badge">2022</div>
          </div>

          <div class="list-card">
            <button class="list-row" id="profilePicturePicker" type="button" aria-label="Add profile picture">
              <div class="row-copy">
                <div class="row-label">Profile picture</div>
              </div>
              <div class="avatar-preview" id="avatarPreview">T</div>
            </button>
            <input id="profileImageInput" type="file" accept="image/*" hidden />
            <a class="list-row" href="profile.html">
              <div class="row-copy">
                <div class="row-label">Profile</div>
              </div>
              <div class="row-arrow">›</div>
            </a>
            <a class="list-row" href="account.html">
              <div class="row-copy">
                <div class="row-label">Security</div>
              </div>
              <div class="row-arrow">›</div>
            </a>
            <a class="list-row" href="account.html">
              <div class="row-copy">
                <div class="row-label">Notifications</div>
              </div>
              <div class="row-arrow">›</div>
            </a>
            <button class="list-row" id="themeToggle" type="button" aria-label="Toggle dark mode">
              <div class="row-copy">
                <div class="row-label">Appearance</div>
              </div>
              <div class="row-arrow" id="themeLabel">Light</div>
            </button>
            <a class="list-row" href="account.html">
              <div class="row-copy">
                <div class="row-label">Linked banks</div>
              </div>
              <div class="row-arrow">›</div>
            </a>
            <a class="list-row" href="account.html">
              <div class="row-copy">
                <div class="row-label">Help and support</div>
              </div>
              <div class="row-arrow">›</div>
            </a>
          </div>

          <div class="list-card">
            <button class="list-row" id="logoutBtn" type="button">
              <div class="row-copy">
                <div class="row-label">Log out</div>
              </div>
              <div class="row-arrow">›</div>
            </button>
          </div>
        `;
      }

      themeToggle = document.getElementById('themeToggle');
      themeLabel = document.getElementById('themeLabel');
      profileImageInput = document.getElementById('profileImageInput');
      profilePicturePicker = document.getElementById('profilePicturePicker');
      avatarPreview = document.getElementById('avatarPreview');
      accountAvatar = document.getElementById('accountAvatar');
      logoutBtn = document.getElementById('logoutBtn');

      const savedTheme = localStorage.getItem('split-theme') || 'light';
      const savedAvatar = localStorage.getItem('split-profile-image');
      applyTheme(savedTheme);
      updateAvatarDisplay(savedAvatar);

      themeToggle?.addEventListener('click', () => {
        const nextTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
      });

      profilePicturePicker?.addEventListener('click', () => profileImageInput?.click());
      profileImageInput?.addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => updateAvatarDisplay(reader.result);
        reader.readAsDataURL(file);
      });

      logoutBtn?.addEventListener('click', async () => {
        try {
          await requestJson('/api/auth/logout', { method: 'POST' });
        } catch (_error) {
          // ignore server-side logout errors and continue to the landing page
        } finally {
          setAccountSectionsVisible(false);
          localStorage.removeItem('split-demo-user');
          window.location.href = 'index.html';
        }
      });
    }

    function generateUsernameFromLogin(value) {
      const base = (value || '').trim().toLowerCase();
      if (!base) return `user${Date.now().toString().slice(-6)}`;
      const cleaned = base.replace(/[^a-z0-9]+/g, '').slice(0, 18) || `user${Date.now().toString().slice(-6)}`;
      return cleaned || `user${Date.now().toString().slice(-6)}`;
    }

    function ensureVerificationInput() {
      if (authVerification || !authForm) return;

      const verificationInput = document.createElement('input');
      verificationInput.id = 'authVerification';
      verificationInput.name = 'verificationCode';
      verificationInput.type = 'text';
      verificationInput.inputMode = 'numeric';
      verificationInput.maxLength = 6;
      verificationInput.placeholder = 'Verification code';
      verificationInput.setAttribute('aria-label', 'Verification code');

      authForm.insertBefore(verificationInput, authPassword?.nextSibling || null);
      authVerification = verificationInput;
    }

    function setAuthMode(mode) {
      authMode = mode;
      const isSignup = mode === 'signup';
      const isVerify = mode === 'verify';
      const isLogin = mode === 'login';

      if (authFullName) {
        authFullName.hidden = !isSignup;
      }
      if (isVerify) {
        ensureVerificationInput();
      }
      if (authVerification) {
        authVerification.hidden = !isVerify;
      }

      authSubmitBtn.textContent = isSignup ? 'Create account' : isVerify ? 'Verify code' : 'Log in';
      toggleAuthModeBtn.textContent = isSignup ? 'Switch to login' : isVerify ? 'Switch to login' : 'Switch to sign up';
      if (authTitle) {
        authTitle.textContent = isSignup ? 'Create your account' : isVerify ? 'Check your email' : 'Welcome back';
      }
      if (authSubtitle) {
        authSubtitle.textContent = isSignup
          ? 'One payment in, everyone gets their agreed share.'
          : isVerify
            ? 'Enter the 6 digit code we sent to continue.'
            : 'Sign in to view balances and manage your splits.';
      }
      if (!isSignup) {
        authFullName.value = '';
      }
      if (!isVerify && authVerification) {
        authVerification.value = '';
      }
      if (!isLogin && !isVerify) {
        authPassword.value = '';
      }
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
      });

      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (_error) { data = { message: text }; }

      if (!response.ok) {
        throw new Error(data.error || data.message || 'Request failed.');
      }

      return data;
    }

    function storeSessionUser(user) {
      if (!user) {
        localStorage.removeItem('split-demo-user');
        return;
      }
      localStorage.setItem('split-demo-user', JSON.stringify(user));
    }

    async function loadSessionUser() {
      try {
        const data = await requestJson('/api/auth/me');
        if (data.user) {
          storeSessionUser(data.user);
          setAccountSectionsVisible(true);
          const fullName = data.user.fullName || data.user.username || 'User';
          const firstName = fullName.split(' ')[0];
          const greetName = document.querySelector('.greet-text .name');
          if (greetName) greetName.textContent = firstName;
          const profileName = document.querySelector('.profile-name');
          if (profileName) profileName.textContent = fullName;
          const avatarText = firstName.charAt(0).toUpperCase();
          const renderedAccountAvatar = document.getElementById('accountAvatar');
          if (renderedAccountAvatar && !renderedAccountAvatar.style.backgroundImage) {
            renderedAccountAvatar.textContent = avatarText;
          }
          if (document.querySelector('.greet-avatar')) {
            const avatarEl = document.querySelector('.greet-avatar');
            avatarEl.textContent = avatarText;
          }
          return;
        }
        setAccountSectionsVisible(false);
      } catch (_error) {
        setAccountSectionsVisible(false);
        storeSessionUser(null);
      }
    }

    authForm?.addEventListener('submit', async (event) => {
      event.preventDefault();
      setAuthStatus('');

      try {
        const payload = {
          fullName: authFullName?.value?.trim(),
          login: authLogin?.value?.trim(),
          password: authPassword?.value,
        };

        if (authMode === 'verify') {
          if (!pendingUserId || !authVerification?.value?.trim()) {
            throw new Error('Enter the 6-digit verification code sent to your email.');
          }
          await requestJson('/api/auth/verify-email', {
            method: 'POST',
            body: JSON.stringify({ userId: pendingUserId, code: authVerification.value.trim() }),
          });
          setAuthStatus('Email verified successfully. You can now log in.');
          pendingUserId = null;
          setAuthMode('login');
          return;
        }

        if (authMode === 'signup') {
          if (!payload.fullName || !payload.username || !payload.password || !payload.login) {
            throw new Error('Full name, username, password, and email/phone are required.');
          }

          const loginValue = payload.login;
          const isEmail = loginValue.includes('@');
          const signupResponse = await requestJson('/api/auth/signup', {
            method: 'POST',
            body: JSON.stringify({
              fullName: payload.fullName,
              username: generateUsernameFromLogin(loginValue),
              email: isEmail ? loginValue : undefined,
              phone: isEmail ? undefined : loginValue,
              password: payload.password,
            }),
          });

          pendingUserId = signupResponse.user?.id || null;
          setAuthStatus('Account created. Enter the 6-digit code we sent to your email to verify your account.');
          authPassword.value = '';
          authVerification.hidden = false;
          setAuthMode('verify');
          return;
        }

        if (!payload.login || !payload.password) {
          throw new Error('Email/phone/username and password are required.');
        }

        const loginResponse = await requestJson('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            login: payload.login,
            password: payload.password,
          }),
        });

        storeSessionUser(loginResponse.user);
        setAuthStatus('Logged in successfully. Redirecting...');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } catch (error) {
        setAuthStatus(error.message, true);
      }
    });

    toggleAuthModeBtn?.addEventListener('click', () => {
      if (authMode === 'verify') {
        setAuthMode('login');
      } else {
        setAuthMode(authMode === 'signup' ? 'login' : 'signup');
      }
      setAuthStatus('');
    });

    function applyTheme(theme) {
      body.setAttribute('data-theme', theme);
      if (themeLabel) {
        themeLabel.textContent = theme === 'dark' ? 'Dark' : 'Light';
      }
      localStorage.setItem('split-theme', theme);
    }

    function updateAvatarDisplay(imageDataUrl) {
      const avatarEls = [accountAvatar, homeAvatar, avatarPreview].filter(Boolean);
      avatarEls.forEach((avatarEl) => {
        if (imageDataUrl) {
          avatarEl.style.backgroundImage = `url(${imageDataUrl})`;
          avatarEl.style.backgroundColor = 'transparent';
          avatarEl.textContent = '';
        } else {
          avatarEl.style.backgroundImage = 'none';
          avatarEl.style.backgroundColor = 'var(--green)';
          avatarEl.textContent = 'T';
        }
      });
      if (imageDataUrl) {
        localStorage.setItem('split-profile-image', imageDataUrl);
      } else {
        localStorage.removeItem('split-profile-image');
      }
    }

    setAccountSectionsVisible(false);
    setAuthMode('signup');
    loadSessionUser();
  </script>
</body>
</html>
