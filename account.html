<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split — Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F1210;
    --paper: #F7F5F0;
    --paper-dim: #EFEBE1;
    --line: #DCD7C9;
    --green: #2E7D5B;
    --green-tint: #E4EFE8;
    --amber: #C77B3D;
    --muted: #6B6A62;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .content { padding: 20px 20px 32px; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .screen-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 4px;
  }
  .nav-back {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--white); color: var(--ink); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .screen-title {
    font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600;
    flex: 1; text-align: center; margin-right: 36px;
  }
  .profile-card {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px;
    display: flex; align-items: center; gap: 12px;
  }
  .profile-avatar {
    width: 48px; height: 48px; border-radius: 50%; background: var(--green);
    color: var(--white); display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px;
    flex-shrink: 0;
  }
  .profile-copy { flex: 1; min-width: 0; }
  .profile-name {
    font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600;
    line-height: 1.1;
  }
  .profile-meta {
    font-size: 12px; color: var(--muted); margin-top: 3px;
  }
  .profile-badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--green); background: var(--green-tint);
    padding: 7px 8px; border-radius: 999px;
  }
  .list-card {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px;
    padding: 0 18px;
  }
  .list-row {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: none; border: none; border-top: 1px solid var(--line);
    padding: 15px 0; text-align: left; color: var(--ink); font: inherit; cursor: pointer;
    text-decoration: none;
  }
  .list-row:first-child { border-top: none; }
  .row-copy { flex: 1; min-width: 0; }
  .row-label { font-size: 14px; font-weight: 600; }
  .row-arrow {
    font-size: 22px; color: var(--muted); line-height: 1; margin-left: 8px;
  }
  .tabbar {
    position: sticky; bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; align-items: center;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 600; color: #ADA99A;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 6px 8px; border-radius: 10px; text-decoration: none;
  }
  .tab-item.on {
    color: var(--ink);
    background: var(--green-tint);
  }
  .tab-item.on .tab-icon { color: var(--green); }
  .tab-icon { font-size: 18px; }
  @media (min-width: 481px) {
    body { background: var(--paper-dim); }
    .page {
      margin-top: 24px;
      margin-bottom: 24px;
      background: var(--paper);
      border-radius: 20px;
      border: 1px solid var(--line);
      overflow: hidden;
      min-height: calc(100vh - 48px);
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="content">
      <div class="screen-header">
        <a class="nav-back" href="index.html" aria-label="Back to home">←</a>
        <div class="screen-title">Account</div>
        <div style="width: 36px;"></div>
      </div>

      <div class="profile-card">
        <div class="profile-avatar">T</div>
        <div class="profile-copy">
          <div class="profile-name">Tunmi</div>
          <div class="profile-meta">Premium member</div>
        </div>
        <div class="profile-badge">2022</div>
      </div>

      <div class="list-card">
        <a class="list-row" href="profile.html">
          <div class="row-copy">
            <div class="row-label">Profile</div>
          </div>
          <div class="row-arrow">›</div>
        </a>
        <a class="list-row" href="account.html">
          <div class="row-copy">
            <div class="row-label">Security</div>
          </div>
          <div class="row-arrow">›</div>
        </a>
        <a class="list-row" href="account.html">
          <div class="row-copy">
            <div class="row-label">Notifications</div>
          </div>
          <div class="row-arrow">›</div>
        </a>
        <a class="list-row" href="account.html">
          <div class="row-copy">
            <div class="row-label">Linked banks</div>
          </div>
          <div class="row-arrow">›</div>
        </a>
        <a class="list-row" href="account.html">
          <div class="row-copy">
            <div class="row-label">Help and support</div>
          </div>
          <div class="row-arrow">›</div>
        </a>
      </div>

      <div class="list-card">
        <a class="list-row" href="index.html">
          <div class="row-copy">
            <div class="row-label">Log out</div>
          </div>
          <div class="row-arrow">›</div>
        </a>
      </div>
    </div>

    <div class="tabbar">
      <a class="tab-item" href="index.html"><div class="tab-icon">⌂</div>Home</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">🏦</div>Banks</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">📈</div>Insights</a>
      <a class="tab-item" href="index.html"><div class="tab-icon">🔗</div>Links</a>
      <a class="tab-item on" href="account.html"><div class="tab-icon">👤</div>Account</a>
    </div>
  </div>
</body>
</html>
